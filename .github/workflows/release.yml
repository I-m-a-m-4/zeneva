name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libapplaunch-desktop-utils-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Sync node version and setup cache
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        env:
          IS_TAURI: true
        run: |
          # Strip unnecessary pages and Server Action folders to comply with static export
          node -e "const fs = require('fs'); ['src/actions', 'src/ai', 'src/app/api', 'src/app/robots.ts', 'src/app/sitemap.ts', 'src/app/industries', 'src/app/blog', 'src/app/store', 'src/app/(app)/ai-insights', 'src/app/(app)/support', 'src/app/(app)/inventory/troubleshoot'].forEach(p => { if (fs.existsSync(p)) { fs.rmSync(p, { recursive: true, force: true }); } });"
          # Replace root page with a simple redirect to login for the desktop app
          node -e "const fs = require('fs'); const content = \"'use client';\nimport { useEffect } from 'react';\nimport { useRouter } from 'next/navigation';\n\nexport default function Home() {\n  const router = useRouter();\n  useEffect(() => {\n    router.replace('/login');\n  }, [router]);\n  return null;\n}\"; fs.writeFileSync('src/app/page.tsx', content);"
          npm run build

      - name: Build the app
        uses: tauri-apps/tauri-action@v0.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # tauri-action replaces this with the app version
          releaseName: 'Zeneva v__VERSION__'
          releaseBody: 'See the assets below to download the new version.'
          releaseDraft: true
          prerelease: false
